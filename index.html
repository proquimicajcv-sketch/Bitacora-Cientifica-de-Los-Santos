        let currentCategory = 'anfibios';
        let currentIndex = 0;

        function loadSpeciesOfCategory() {
            const select = document.getElementById('categorySelect');
            currentCategory = select.value;
            currentIndex = 0;
            renderCurrentRecord();
        }

        function renderCurrentRecord() {
            if (!bitacoraData || !bitacoraData.species) return;
            
            const list = bitacoraData.species[currentCategory];
            const counter = document.getElementById('counter');

            if (!list || list.length === 0) {
                document.getElementById('val-name').innerText = "No hay registros en esta categoría";
                document.getElementById('val-sci').innerText = "-";
                document.getElementById('val-loc').innerText = "-";
                document.getElementById('val-habitat').innerText = "-";
                document.getElementById('val-niche').innerText = "-";
                document.getElementById('val-morph').innerText = "-";
                document.getElementById('val-ethology').innerText = "-";
                document.getElementById('val-repro').innerText = "-";
                document.getElementById('val-courtship').innerText = "-";
                document.getElementById('val-relations').innerText = "-";
                document.getElementById('val-science').innerText = "-";
                counter.innerText = "Registro: 0/0";
                return;
            }

            if (currentIndex >= list.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = list.length - 1;

            const item = list[currentIndex];
            document.getElementById('val-name').innerText = item.name || item.sci || "Sin nombre";
            document.getElementById('val-sci').innerText = item.sci || "-";
            document.getElementById('val-loc').innerText = item.loc || "Zona de los Santos";
            document.getElementById('val-habitat').innerText = item.habitat || "-";
            document.getElementById('val-niche').innerText = item.niche || "-";
            document.getElementById('val-morph').innerText = item.morph || "-";
            document.getElementById('val-ethology').innerText = item.ethology || "-";
            document.getElementById('val-repro').innerText = item.repro || "-";
            document.getElementById('val-courtship').innerText = item.courtship || "-";
            document.getElementById('val-relations').innerText = item.relations || "-";
            document.getElementById('val-science').innerText = item.science || "-";
            
            counter.innerText = `Registro: ${currentIndex + 1} / ${list.length}`;
        }

        function changeRecord(direction) {
            if (!bitacoraData || !bitacoraData.species[currentCategory]) return;
            const list = bitacoraData.species[currentCategory];
            if (!list || list.length === 0) return;

            currentIndex += direction;
            if (currentIndex >= list.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = list.length - 1;
            renderCurrentRecord();
        }

        function populateSitesDropdown() {
            const siteSelect = document.getElementById('siteSelect');
            siteSelect.innerHTML = '';
            
            if (!bitacoraData || !bitacoraData.sites) return;

            bitacoraData.sites.forEach((site, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = site.name;
                siteSelect.appendChild(opt);
            });

            displaySiteInfo();
        }

        function displaySiteInfo() {
            const siteSelect = document.getElementById('siteSelect');
            const idx = siteSelect.value;
            if (!bitacoraData || !bitacoraData.sites || idx === "") return;

            const site = bitacoraData.sites[idx];
            document.getElementById('site-popular').innerText = site.popularName || "-";
            document.getElementById('site-alt').innerText = site.alt || "-";
            document.getElementById('site-ecology').innerText = (site.ecology || "") + " " + (site.history || "");
        }

        window.onload = function() {
            populateSitesDropdown();
            loadSpeciesOfCategory();
        };
