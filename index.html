<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora de Campo - Zona de los Santos</title>
    <style>
        :root {
            --bg-dark: #2b1d12;
            --panel-bg: #3d2817;
            --accent-gold: #c29b38;
            --text-light: #f4e8d1;
            --btn-red: #8b2500;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }
        .container, .sidebar {
            background: var(--panel-bg);
            border: 2px solid var(--accent-gold);
            padding: 20px;
            border-radius: 8px;
        }
        h2, h3 { color: var(--accent-gold); border-bottom: 1px solid var(--accent-gold); padding-bottom: 5px; }
        select, button {
            background: #5a3d28;
            color: var(--text-light);
            border: 1px solid var(--accent-gold);
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background: var(--btn-red); }
        .field-group { margin-bottom: 12px; }
        .field-label { font-weight: bold; color: var(--accent-gold); font-size: 0.9rem; }
        .field-value { background: #2b1d12; padding: 6px; border-radius: 4px; margin-top: 2px; min-height: 24px; }
        .nav-buttons { display: flex; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- Panel Izquierdo: Visualizador de Fichas -->
    <div class="container">
        <h2>Bitácora de Campo - Zona de los Santos</h2>
        
        <!-- Selector de Categorías -->
        <div class="field-group">
            <label class="field-label">Categoría:</label>
            <select id="categorySelect" onchange="loadSpeciesOfCategory()">
                <option value="anfibios">Anfibios</option>
                <option value="aves">Aves</option>
                <option value="flora">Flora</option>
                <option value="hongos">Hongos</option>
                <option value="mamiferos">Mamíferos</option>
                <option value="reptiles">Reptiles</option>
            </select>
        </div>

        <!-- Ficha de Registro -->
        <div id="fichaContent">
            <div class="field-group">
                <div class="field-label">Nombre Común:</div>
                <div class="field-value" id="val-name">Cargando...</div>
            </div>
            <div class="field-group">
                <div class="field-label">Nombre Científico:</div>
                <div class="field-value" id="val-sci">Cargando...</div>
            </div>
            <div class="field-group">
                <div class="field-label">Distribución / Ubicación:</div>
                <div class="field-value" id="val-loc">Cargando...</div>
            </div>
            <div class="field-group">
                <div class="field-label">Hábitat:</div>
                <div class="field-value" id="val-habitat">Cargando...</div>
            </div>
            <div class="field-group">
                <div class="field-label">Nicho Ecológico:</div>
                <div class="field-value" id="val-niche">Cargando...</div>
            </div>
            <div class="field-group">
                <div class="field-label">Morfología:</div>
                <div class="field-value" id="val-morph">Cargando...</div>
            </div>
        </div>

        <div class="nav-buttons">
            <button onclick="changeRecord(-1)">◄ Anterior</button>
            <button onclick="changeRecord(1)">Siguiente ►</button>
        </div>
        <div id="counter" style="text-align: center; margin-top: 10px; font-size: 0.9rem; color: var(--accent-gold);">Registro: 0/0</div>
    </div>

    <!-- Panel Derecho: Sitios y Cerros Emblemáticos -->
    <div class="sidebar">
        <h3>📍 Sitios y Cerros</h3>
        <div class="field-group">
            <label class="field-label">Seleccionar Sitio / Cerro:</label>
            <select id="siteSelect" onchange="displaySiteInfo()">
                <!-- Se llena dinámicamente desde el JSON -->
            </select>
        </div>
        <div class="field-group">
            <label class="field-label">Nombre Popular:</label>
            <div class="field-value" id="site-popular">-</div>
        </div>
        <div class="field-group">
            <label class="field-label">Altitud:</label>
            <div class="field-value" id="site-alt">-</div>
        </div>
        <div class="field-group">
            <label class="field-label">Ecología e Historia:</label>
            <div class="field-value" id="site-ecology">-</div>
        </div>
    </div>

    <script>
        let bitacoraData = null;
        let currentCategory = 'anfibios';
        let currentIndex = 0;

        // Cargar el archivo JSON de respaldo o local
        async function initBitacora() {
            try {
                const response = await fetch('bitacora_completa_los_santos_backup.json');
                bitacoraData = await response.json();
                
                populateSitesDropdown();
                loadSpeciesOfCategory();
            } catch (error) {
                console.error("Error al cargar el archivo JSON:", error);
                alert("Asegúrate de tener el archivo 'bitacora_completa_los_santos_backup.json' en la misma carpeta.");
            }
        }

        function loadSpeciesOfCategory() {
            const select = document.getElementById('categorySelect');
            currentCategory = select.value;
            currentIndex = 0;
            renderCurrentRecord();
        }

        function renderCurrentRecord() {
            if (!bitacoraData || !bitacoraData.species[currentCategory]) return;
            
            const list = bitacoraData.species[currentCategory];
            if (list.length === 0) {
                document.getElementById('val-name').innerText = "No hay registros en esta categoría";
                document.getElementById('val-sci').innerText = "-";
                document.getElementById('val-loc').innerText = "-";
                document.getElementById('val-habitat').innerText = "-";
                document.getElementById('val-niche').innerText = "-";
                document.getElementById('val-morph').innerText = "-";
                document.getElementById('counter').innerText = "Registro: 0/0";
                return;
            }

            if (currentIndex >= list.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = list.length - 1;

            const item = list[currentIndex];
            document.getElementById('val-name').innerText = item.name || "Sin nombre común";
            document.getElementById('val-sci').innerText = item.sci || "Sin nombre científico";
            document.getElementById('val-loc').innerText = item.loc || "No especificada";
            document.getElementById('val-habitat').innerText = item.habitat || "-";
            document.getElementById('val-niche').innerText = item.niche || "-";
            document.getElementById('val-morph').innerText = item.morph || "-";
            
            document.getElementById('counter').innerText = `Registro: ${currentIndex + 1}/${list.length}`;
        }

        function changeRecord(direction) {
            if (!bitacoraData || !bitacoraData.species[currentCategory]) return;
            const list = bitacoraData.species[currentCategory];
            if (list.length === 0) return;

            currentIndex += direction;
            if (currentIndex >= list.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = list.length - 1;
            renderCurrentRecord();
        }

        function populateSitesDropdown() {
            const siteSelect = document.getElementById('siteSelect');
            siteSelect.innerHTML = '';
            
            if (!bitacoraData || !bitacoraData.sites) return;

            bitacoraData.sites.forEach((site, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = site.name;
                siteSelect.appendChild(opt);
            });

            displaySiteInfo();
        }

        function displaySiteInfo() {
            const siteSelect = document.getElementById('siteSelect');
            const idx = siteSelect.value;
            if (!bitacoraData || !bitacoraData.sites || idx === "") return;

            const site = bitacoraData.sites[idx];
            document.getElementById('site-popular').innerText = site.popularName || "-";
            document.getElementById('site-alt').innerText = site.alt || "-";
            document.getElementById('site-ecology').innerText = site.ecology || site.history || "-";
        }

        // Inicializar al cargar la página
        window.onload = initBitacora;
    </script>
</body>
</html>
